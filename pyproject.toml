[project]
name = "hearth"
version = "0.1.0"
description = "A home for agents that do useful work."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.4", "uvicorn==0.52.4"]

[build-system]
requires = ["uv_build>=0.10.4,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.4", "ty==0.0.74", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
