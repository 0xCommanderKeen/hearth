name: publish
on:
  workflow_run:
    workflows: [check]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Image identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the tested revision
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.identity.outputs.image }}:sha-${{ steps.identity.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the deployment reference
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'HEARTH_IMAGE=%s@%s\n' "$IMAGE" "$DIGEST" > deployment.env
          printf 'Application image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-image
          path: deployment.env

  # The operator will select a server before a rollout job is connected here.
  # Keep sandbox-image upgrades separate: stores pin them and active runs must drain.
