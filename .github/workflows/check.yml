name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.4'
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - run: npm install -g pnpm@11.22.0
      - run: make check
